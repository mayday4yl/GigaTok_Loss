<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1320" viewBox="0 0 2100 1320">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#26323f"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b4233c"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .subtitle { font: 500 18px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 21px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .label { font: 700 17px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .small { font: 500 14px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 500 12px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .formula { font: 600 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #1f2937; }
      .box { stroke-width: 2; rx: 10; ry: 10; }
      .data { fill: #eefcf4; stroke: #2b9b65; }
      .frozen { fill: #edf4ff; stroke: #557fbd; }
      .train { fill: #fff5df; stroke: #d28a18; }
      .attn { fill: #f7f2ff; stroke: #7b61c9; }
      .loss { fill: #fff1f2; stroke: #cc3850; }
      .neutral { fill: #f8fafc; stroke: #94a3b8; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 9; ry: 9; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; ry: 14; }
      .arrow { stroke: #26323f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-red { stroke: #b4233c; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .thin { stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0" y="0" width="2100" height="1320" fill="#ffffff"/>
  <text x="1050" y="48" text-anchor="middle" class="title">GigaTok Text-Conditioned Decoder + Image-to-Text High-Rank Loss</text>
  <text x="1050" y="78" text-anchor="middle" class="subtitle">Detailed flow based on current v2 implementation: frozen T5 + frozen GigaTok front path + trainable decoder-side text injection</text>

  <!-- Legend -->
  <rect x="60" y="105" width="525" height="56" class="note"/>
  <rect x="82" y="123" width="26" height="18" class="frozen" rx="4"/>
  <text x="118" y="138" class="tiny">Frozen</text>
  <rect x="180" y="123" width="26" height="18" class="train" rx="4"/>
  <text x="216" y="138" class="tiny">Trainable</text>
  <rect x="312" y="123" width="26" height="18" class="attn" rx="4"/>
  <text x="348" y="138" class="tiny">Cross-attention</text>
  <rect x="462" y="123" width="26" height="18" class="loss" rx="4"/>
  <text x="498" y="138" class="tiny">HR loss</text>

  <!-- Text branch -->
  <rect x="60" y="205" width="1500" height="230" class="group"/>
  <text x="84" y="235" class="section">Text branch: rendered text inside the image</text>

  <rect x="90" y="275" width="150" height="62" class="box data"/>
  <text x="165" y="301" text-anchor="middle" class="label">Text y</text>
  <text x="165" y="324" text-anchor="middle" class="small">rendered text</text>

  <rect x="290" y="275" width="210" height="62" class="box frozen"/>
  <text x="395" y="301" text-anchor="middle" class="label">Frozen T5 Tokenizer</text>
  <text x="395" y="324" text-anchor="middle" class="small">token ids + attention_mask</text>

  <rect x="550" y="275" width="205" height="62" class="box frozen"/>
  <text x="652" y="301" text-anchor="middle" class="label">Frozen T5 Encoder</text>
  <text x="652" y="324" text-anchor="middle" class="formula">output_hidden_states=True</text>

  <rect x="805" y="265" width="250" height="82" class="box neutral"/>
  <text x="930" y="294" text-anchor="middle" class="label">Encoder block outputs</text>
  <text x="930" y="318" text-anchor="middle" class="small">24 layers, exclude embedding h[0]</text>
  <text x="930" y="339" text-anchor="middle" class="formula">use hidden_states[k+1]</text>

  <rect x="1110" y="275" width="200" height="62" class="box neutral"/>
  <text x="1210" y="301" text-anchor="middle" class="label">Select mid 8 layers</text>
  <text x="1210" y="324" text-anchor="middle" class="formula">l_text ∈ {8,...,15}</text>

  <rect x="1360" y="265" width="170" height="82" class="box neutral"/>
  <text x="1445" y="294" text-anchor="middle" class="label">T5 feature</text>
  <text x="1445" y="318" text-anchor="middle" class="formula">H_txt</text>
  <text x="1445" y="339" text-anchor="middle" class="formula">[B,T,2048]</text>

  <path d="M240 306 L290 306" class="arrow"/>
  <path d="M500 306 L550 306" class="arrow"/>
  <path d="M755 306 L805 306" class="arrow"/>
  <path d="M1055 306 L1110 306" class="arrow"/>
  <path d="M1310 306 L1360 306" class="arrow"/>

  <rect x="1360" y="370" width="170" height="42" class="note"/>
  <text x="1445" y="396" text-anchor="middle" class="tiny">T = tokenizer max length before removing padding</text>

  <!-- Image branch -->
  <rect x="60" y="485" width="1500" height="250" class="group"/>
  <text x="84" y="515" class="section">Image branch: frozen GigaTok front path, then decoder-side feature space</text>

  <rect x="90" y="565" width="150" height="62" class="box data"/>
  <text x="165" y="591" text-anchor="middle" class="label">Image x</text>
  <text x="165" y="614" text-anchor="middle" class="small">input image</text>

  <rect x="290" y="565" width="210" height="62" class="box frozen"/>
  <text x="395" y="591" text-anchor="middle" class="label">Frozen GigaTok Encoder</text>
  <text x="395" y="614" text-anchor="middle" class="small">image representation</text>

  <rect x="550" y="565" width="205" height="62" class="box frozen"/>
  <text x="652" y="591" text-anchor="middle" class="label">Frozen Quantizer</text>
  <text x="652" y="614" text-anchor="middle" class="formula">[B,8,1,256]</text>

  <rect x="805" y="565" width="250" height="62" class="box frozen"/>
  <text x="930" y="591" text-anchor="middle" class="label">Frozen Post-Quant Projection</text>
  <text x="930" y="614" text-anchor="middle" class="formula">[B,256,1,256]</text>

  <rect x="1110" y="565" width="200" height="62" class="box train"/>
  <text x="1210" y="591" text-anchor="middle" class="label">Decoder Embed</text>
  <text x="1210" y="614" text-anchor="middle" class="formula">256 → 1024</text>

  <rect x="1360" y="555" width="170" height="82" class="box neutral"/>
  <text x="1445" y="584" text-anchor="middle" class="label">Image feature</text>
  <text x="1445" y="608" text-anchor="middle" class="formula">Z_img</text>
  <text x="1445" y="629" text-anchor="middle" class="formula">[B,256,1024]</text>

  <path d="M240 596 L290 596" class="arrow"/>
  <path d="M500 596 L550 596" class="arrow"/>
  <path d="M755 596 L805 596" class="arrow"/>
  <path d="M1055 596 L1110 596" class="arrow"/>
  <path d="M1310 596 L1360 596" class="arrow"/>

  <rect x="1015" y="665" width="300" height="42" class="note"/>
  <text x="1165" y="691" text-anchor="middle" class="tiny">post-quant is frozen; decoder_embed belongs to trainable decoder</text>

  <!-- Text adapter -->
  <rect x="1625" y="205" width="415" height="250" class="group"/>
  <text x="1648" y="235" class="section">Decoder-side text adapter</text>

  <rect x="1660" y="275" width="340" height="62" class="box train"/>
  <text x="1830" y="301" text-anchor="middle" class="label">Text Projection + LayerNorm</text>
  <text x="1830" y="324" text-anchor="middle" class="formula">2048 → 1024</text>

  <rect x="1660" y="360" width="340" height="62" class="box train"/>
  <text x="1830" y="386" text-anchor="middle" class="label">+ learnable text_type_embedding</text>
  <text x="1830" y="409" text-anchor="middle" class="small">no text position embedding</text>

  <rect x="1660" y="485" width="340" height="78" class="box neutral"/>
  <text x="1830" y="514" text-anchor="middle" class="label">Text feature / memory</text>
  <text x="1830" y="538" text-anchor="middle" class="formula">Z_txt ∈ R^{B×T×1024}</text>

  <path d="M1530 306 C1590 306 1608 306 1660 306" class="arrow"/>
  <path d="M1830 337 L1830 360" class="arrow"/>
  <path d="M1830 422 L1830 485" class="arrow"/>

  <!-- Cross attention detail -->
  <rect x="60" y="790" width="1980" height="265" class="group"/>
  <text x="84" y="820" class="section">Selected GigaTok decoder cross-attention layer</text>

  <rect x="100" y="875" width="255" height="70" class="box neutral"/>
  <text x="228" y="902" text-anchor="middle" class="label">Image queries</text>
  <text x="228" y="927" text-anchor="middle" class="formula">Q_img ∈ R^{B×256×1024}</text>

  <rect x="435" y="855" width="280" height="110" class="box neutral"/>
  <text x="575" y="884" text-anchor="middle" class="label">Concat feature as K,V source</text>
  <text x="575" y="910" text-anchor="middle" class="formula">Z_mem = concat(Z_img, Z_txt)</text>
  <text x="575" y="934" text-anchor="middle" class="formula">Z_mem ∈ R^{B×(256+T)×1024}</text>

  <rect x="795" y="855" width="250" height="110" class="box attn"/>
  <text x="920" y="884" text-anchor="middle" class="label">Linear projections</text>
  <text x="920" y="910" text-anchor="middle" class="formula">Q = Wq(Q_img)</text>
  <text x="920" y="934" text-anchor="middle" class="formula">K,V = Wk,Wv(Z_mem)</text>

  <rect x="1125" y="855" width="250" height="110" class="box attn"/>
  <text x="1250" y="884" text-anchor="middle" class="label">Pre-softmax score</text>
  <text x="1250" y="910" text-anchor="middle" class="formula">S = QK^T / sqrt(d_head)</text>
  <text x="1250" y="934" text-anchor="middle" class="formula">[B,16,256,256+T]</text>

  <rect x="1455" y="855" width="245" height="110" class="box attn"/>
  <text x="1578" y="884" text-anchor="middle" class="label">Padding mask before softmax</text>
  <text x="1578" y="910" text-anchor="middle" class="formula">S[..., pad_text] = -inf</text>
  <text x="1578" y="934" text-anchor="middle" class="small">padding attention becomes 0</text>

  <rect x="1780" y="855" width="220" height="110" class="box attn"/>
  <text x="1890" y="884" text-anchor="middle" class="label">Post-softmax attention</text>
  <text x="1890" y="910" text-anchor="middle" class="formula">A = softmax(S, dim=-1)</text>
  <text x="1890" y="934" text-anchor="middle" class="formula">[B,16,256,256+T]</text>

  <path d="M355 910 L435 910" class="arrow"/>
  <path d="M715 910 L795 910" class="arrow"/>
  <path d="M1045 910 L1125 910" class="arrow"/>
  <path d="M1375 910 L1455 910" class="arrow"/>
  <path d="M1700 910 L1780 910" class="arrow"/>

  <path d="M1445 637 C1180 720 690 760 575 855" class="arrow thin"/>
  <path d="M1830 563 C1540 665 815 735 575 855" class="arrow thin"/>
  <path d="M1445 637 C1070 730 380 760 228 875" class="arrow thin"/>

  <rect x="430" y="985" width="292" height="42" class="note"/>
  <text x="576" y="1011" text-anchor="middle" class="tiny">K,V source length = 256 image tokens + T text tokens</text>
  <rect x="94" y="985" width="268" height="42" class="note"/>
  <text x="228" y="1011" text-anchor="middle" class="tiny">Query length = 256 image positions</text>

  <!-- HR loss pipeline -->
  <rect x="60" y="1090" width="1980" height="185" class="group"/>
  <text x="84" y="1120" class="section">High-Rank loss from image-to-text attention block</text>

  <rect x="120" y="1160" width="230" height="70" class="box loss"/>
  <text x="235" y="1188" text-anchor="middle" class="label">Crop text columns</text>
  <text x="235" y="1212" text-anchor="middle" class="formula">M=A[:,:,:,256:256+T]</text>

  <rect x="430" y="1160" width="230" height="70" class="box loss"/>
  <text x="545" y="1188" text-anchor="middle" class="label">Image-to-text matrix</text>
  <text x="545" y="1212" text-anchor="middle" class="formula">M ∈ R^{B×16×256×T}</text>

  <rect x="740" y="1160" width="260" height="70" class="box loss"/>
  <text x="870" y="1188" text-anchor="middle" class="label">Per-sample remove padding</text>
  <text x="870" y="1212" text-anchor="middle" class="formula">M_i ∈ R^{16×256×T_valid}</text>

  <rect x="1080" y="1160" width="250" height="70" class="box loss"/>
  <text x="1205" y="1188" text-anchor="middle" class="label">Stack heads + scale</text>
  <text x="1205" y="1212" text-anchor="middle" class="formula">[16·256,T_valid] / sqrt(16)</text>

  <rect x="1410" y="1160" width="250" height="70" class="box loss"/>
  <text x="1535" y="1188" text-anchor="middle" class="label">SVD</text>
  <text x="1535" y="1212" text-anchor="middle" class="formula">σ_i = svdvals(M_i)</text>

  <rect x="1740" y="1160" width="250" height="70" class="box loss"/>
  <text x="1865" y="1188" text-anchor="middle" class="label">HR objective</text>
  <text x="1865" y="1212" text-anchor="middle" class="formula">L_i=mean(|σ_i-τ|), τ=1</text>

  <path d="M1890 965 C1890 1045 235 1060 235 1160" class="arrow-red"/>
  <path d="M350 1195 L430 1195" class="arrow-red"/>
  <path d="M660 1195 L740 1195" class="arrow-red"/>
  <path d="M1000 1195 L1080 1195" class="arrow-red"/>
  <path d="M1330 1195 L1410 1195" class="arrow-red"/>
  <path d="M1660 1195 L1740 1195" class="arrow-red"/>

  <rect x="740" y="1248" width="620" height="42" class="note"/>
  <text x="1050" y="1274" text-anchor="middle" class="tiny">Batch aggregation: L_HR = mean_i L_i over valid samples; skip samples with T_valid &lt; 2</text>
</svg>
